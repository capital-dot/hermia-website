<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermia | Simpro Setup Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #111;
            box-shadow: 0 0 100px rgba(212, 175, 55, 0.1);
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        .back-btn {
            color: #D4AF37;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="javascript:window.close()" class="back-btn">← Close Video</a>
    </div>
    <div class="container">
        <iframe src="https://www.loom.com/embed/56f182849da844709050c5d794f68332?hide_owner=true&hide_share=true&hide_title=true&hideEmbedTopBar=true" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
    </div>
<a class="hermia-global-back" href="index.html" data-flow-back aria-label="Back to the previous Hermia page">← Back</a>
<style>.hermia-global-back{position:fixed;top:18px;left:18px;z-index:9999;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid rgba(201,163,91,.42);background:rgba(8,8,8,.82);color:#e8c17a;font:500 11px/1.1 Arial,sans-serif;letter-spacing:.08em;text-decoration:none;text-transform:uppercase;backdrop-filter:blur(10px)}.hermia-global-back:hover{border-color:#e8c17a;color:#fff}</style>
<script id="hermia-history-back">
(function () {
  var trailKey = 'hermiaNavigationTrail';
  var current = (location.pathname.split('/').pop() || 'index.html');
  var trail = [];
  try { trail = JSON.parse(sessionStorage.getItem(trailKey) || '[]'); } catch (e) { trail = []; }
  if (!Array.isArray(trail)) trail = [];
  if (current === 'index.html') {
    trail = ['index.html'];
  } else if (trail[trail.length - 1] !== current) {
    trail.push(current);
  }
  if (trail.length > 40) trail = trail.slice(-40);
  try { sessionStorage.setItem(trailKey, JSON.stringify(trail)); } catch (e) {}
  document.querySelectorAll('[data-flow-back]').forEach(function (link) {
    link.addEventListener('click', function (event) {
      event.preventDefault();
      var active = trail.slice();
      if (active[active.length - 1] === current) active.pop();
      var destination = active[active.length - 1] || 'index.html';
      if (destination === current) destination = 'index.html';
      if (destination === 'index.html') active = ['index.html'];
      try { sessionStorage.setItem(trailKey, JSON.stringify(active)); } catch (e) {}
      location.assign(destination);
    });
  });
}());
</script>
</body>
</html>
