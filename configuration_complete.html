<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparing Email Connection — Hermia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>/* Hermia configuration completion: a quiet bridge from confirmed payment into the established email-connection journey. */:root{--void:#07070a;--cream:#f4f0e6;--soft:#b8b3a9;--gold:#c9a35b;--pale:#e8c17a;--line:rgba(201,163,91,.22);--display:"Cormorant Garamond",serif;--mono:"IBM Plex Mono",monospace}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(201,163,91,.2),transparent 42%),#07070a;color:var(--cream);font-family:"DM Sans",sans-serif}body:before{position:fixed;inset:0;opacity:.3;background-image:linear-gradient(rgba(201,163,91,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,163,91,.04) 1px,transparent 1px);background-size:56px 56px;content:""}.card{position:relative;width:min(560px,calc(100% - 42px));padding:58px 44px;border:1px solid var(--line);background:rgba(12,12,10,.78);box-shadow:0 34px 90px rgba(0,0,0,.35);text-align:center}.mark{display:grid;width:48px;height:48px;margin:auto;place-items:center;border:1px solid var(--pale);border-radius:50%;color:var(--pale);font:600 28px/1 var(--display)}.spin{width:83px;height:83px;margin:31px auto 27px;border:1px solid rgba(232,193,122,.25);border-top-color:var(--pale);border-radius:50%;box-shadow:0 0 30px rgba(201,163,91,.18);animation:spin 1.25s linear infinite}.eyebrow{color:var(--pale);font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}.card h1{margin:16px 0 12px;font:600 clamp(38px,6vw,58px)/.9 var(--display);letter-spacing:-.06em}.card h1 em{color:var(--pale);font-style:italic;font-weight:500}.card p{margin:0;color:var(--soft);font-size:14px;line-height:1.7}.status{margin-top:22px;color:var(--pale);font:500 10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase}.retry{display:none;margin-top:23px;color:var(--cream);font-size:12px;line-height:1.55}.retry a{color:var(--pale)}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}</style>
</head>
<body><main class="card"><div class="mark">H</div><div class="spin" aria-hidden="true"></div><span class="eyebrow">Configuration payment confirmed</span><h1>Now connect<br><em>your inbox.</em></h1><p>We are preparing the selected email connection so you can securely sign in and finish your existing Hermia setup.</p><div class="status" id="status">Preparing your connection…</div><div class="retry" id="retry">We could not prepare the connection automatically. <a href="configuration.html">Return to configuration</a> and try again.</div></main><script>const WORKER='https://hermianango.capital-fbc.workers.dev';let c={};try{c=JSON.parse(sessionStorage.getItem('hermia_configuration')||'{}')}catch(e){};const qs=new URLSearchParams(location.search);const sessionId=qs.get('session_id')||'';const status=document.getElementById('status'),retry=document.getElementById('retry');async function begin(){if(!c.business_name||!c.contact_name||!c.contact_email||!c.phone||!c.state||!sessionId){status.textContent='We need the configuration and payment confirmation to continue.';retry.style.display='block';return;}try{const res=await fetch(WORKER+'/create-outlooker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:c.contact_name,companyName:c.business_name,gmail:c.contact_email,country:c.country,state:c.state,phone:c.phone,stripeSessionId:sessionId,crmProvider:c.crm,plan:c.email_provider,allowedTrades:Array.isArray(c.trades)&&c.trades.length?c.trades:[c.trade].filter(Boolean),financePlan:'configuration'})});const data=await res.json();if(!res.ok||!data.ok||!data.outlookerId)throw new Error(data.error||'Could not prepare onboarding.');const id=data.outlookerId;status.textContent='Saving your operating rules…';const profileRes=await fetch(WORKER+'/configuration/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:id,configuration:c})});const profileData=await profileRes.json();if(!profileRes.ok||!profileData.ok)throw new Error(profileData.error||'Could not save your operating rules.');sessionStorage.setItem('hermia_customer_id',id);sessionStorage.setItem('hermia_outlooker_id',id);sessionStorage.setItem('hermia_plan',c.email_provider);localStorage.setItem('hermia_customer_id',id);status.textContent='Opening '+(c.email_provider==='outlook'?'Outlook':'Gmail')+' connection…';setTimeout(()=>{location.href='gmail.html?customerId='+encodeURIComponent(id)+'&plan='+encodeURIComponent(c.email_provider)+'&from=configuration';},550);}catch(e){status.textContent='We could not prepare the email connection.';retry.style.display='block';}}begin();</script></body></html>
