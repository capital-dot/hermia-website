<style>
:root{
  --bg:#050505;--bg2:#0b0c0e;--bg3:#101114;--card:#0f1115;
  --border:rgba(255,255,255,0.08);
  --bgold:rgba(212,175,55,0.35);
  --gold:#D4AF37;--gl:#F2D07A;--gdim:rgba(212,175,55,0.07);
  --cream:#F8F8F8;--soft:#B7BEC8;--muted:#7c8087;
  --blue:#2563EB;--bluel:#5B8DEF;--bluedim:rgba(37,99,235,0.12);
  --green:#16A34A;--red:#ef4444;
  --display:"Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}
body{font-family:"DM Sans",sans-serif;font-weight:300;background:var(--bg);color:var(--cream);overflow-x:hidden;max-width:100vw;-webkit-font-smoothing:antialiased}
body.cinematic{overflow:hidden}
::selection{background:rgba(212,175,55,0.2);color:#fff}
a,a:link,a:visited,a:active{color:inherit;text-decoration:none}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
[id]{scroll-margin-top:88px}

nav{position:fixed;top:0;left:0;right:0;z-index:300;padding:0 48px;height:62px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,5,0.9);backdrop-filter:blur(22px);border-bottom:1px solid var(--border);opacity:0;pointer-events:none;transition:opacity .6s ease}
nav.visible{opacity:1;pointer-events:auto}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo img{height:28px;filter:drop-shadow(0 3px 10px rgba(212,175,55,0.25))}
.nav-logo span{font-family:var(--display);font-size:20px;font-weight:600;color:var(--cream)}
.nav-links{display:flex;align-items:center;gap:26px;list-style:none}
.nav-links a{color:var(--soft);font-size:13px;transition:color .2s}
.nav-links a:hover{color:var(--cream)}
.nav-cta{background:linear-gradient(135deg,var(--gl),var(--gold));color:#1a1008 !important;padding:9px 20px;border-radius:9px;font-weight:700;font-size:13px;box-shadow:0 6px 20px rgba(212,175,55,0.3);border:none;cursor:pointer;font-family:"DM Sans",sans-serif;transition:all .2s}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,175,55,0.45)}
.trial-dropdown-wrap{position:relative}
.trial-dropdown{position:absolute;top:calc(100% + 10px);right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;display:none;flex-direction:column;gap:4px;min-width:200px;box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:50}
.trial-dropdown.show{display:flex}
.trial-dropdown-cap{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-family:"Inter",sans-serif;font-weight:700;padding:8px 12px 4px}
.trial-dropdown-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 12px;border-radius:8px;font-size:12.5px;color:var(--soft);transition:background .2s;font-family:"DM Sans",sans-serif}
.trial-dropdown-item:hover{background:rgba(212,175,55,.08);color:#fff}
.trial-dropdown-item strong{color:#fff;font-weight:600;font-size:13.5px}
.trial-dropdown-item span{color:var(--gl);font-size:11px;font-weight:600;white-space:nowrap}

#cinematic-hero{position:relative;width:100%;height:100vh;background:#000;overflow:hidden}
.scene{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:opacity 1s cubic-bezier(0.4,0,0.2,1),visibility 1s ease;-webkit-user-select:none;user-select:none;pointer-events:none}
.scene.active{opacity:1;visibility:visible;pointer-events:auto}
#skip-btn{position:absolute;top:20px;right:24px;z-index:10;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:7px 16px;border-radius:4px;cursor:pointer;font-family:"Inter",sans-serif;transition:all .2s}
#skip-btn:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8)}
#partner-badge{position:absolute;bottom:28px;left:28px;z-index:8;opacity:0;pointer-events:none;transition:opacity 1.1s ease;display:flex;flex-direction:column;align-items:center;gap:6px}
#partner-badge.show{opacity:1}
#partner-badge img{width:92px;height:auto;display:block;filter:drop-shadow(0 8px 22px rgba(0,0,0,0.55))}
#partner-badge .pb-cap{font-family:"Inter",sans-serif;font-size:8.5px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(248,248,248,0.5)}
#scroll-indicator{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:5}
#scroll-indicator.show{opacity:1;pointer-events:auto}
.scroll-text{font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.4)}
.scroll-arrow{width:1px;height:40px;background:linear-gradient(180deg,rgba(212,175,55,0.5),transparent);animation:scroll-drop 1.8s ease-in-out infinite}
@keyframes scroll-drop{0%{transform:scaleY(0);transform-origin:top;opacity:0}40%{transform:scaleY(1);opacity:1}80%{transform:scaleY(1);transform-origin:bottom;opacity:1}100%{transform:scaleY(0);transform-origin:bottom;opacity:0}}
#scene-alert{background:radial-gradient(circle at center,rgba(24,24,26,0.8) 0%,#000 100%)}
.alert-box{text-align:center;animation:fadeInBlur 1.5s ease-out;display:flex;flex-direction:column;align-items:center}
.alert-title{font-family:var(--display);font-size:clamp(36px,5vw,64px);font-weight:300;letter-spacing:12px;margin-bottom:40px;text-transform:uppercase;color:#fff}
.alert-title .gold{color:var(--gl);font-weight:500}
.alert-card{background:rgba(15,17,21,0.95);border:1px solid var(--bgold);padding:52px;border-radius:4px;max-width:580px;box-shadow:0 0 80px rgba(212,175,55,0.08)}
.alert-label{font-size:11px;letter-spacing:5px;color:var(--gl);text-transform:uppercase;margin-bottom:24px;font-weight:600;font-family:"Inter",sans-serif}
.alert-line{width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gl),transparent);margin:36px auto 0}
.narrative-box{text-align:center;max-width:800px;padding:0 20px}
.narrative-title{font-family:var(--display);font-size:clamp(32px,6vw,64px);font-weight:300;line-height:1.1;letter-spacing:-0.02em;color:#fff;margin-bottom:20px;animation:fadeInBlur 1.4s ease-out}
.narrative-title em{font-style:italic;color:var(--gl);font-weight:400}
.narrative-sub{font-size:14px;text-transform:uppercase;letter-spacing:0.4em;color:var(--soft);opacity:0.7;font-family:"Inter",sans-serif}
#scene-chat{background:radial-gradient(circle at center,#0d0d0f 0%,#000 100%)}
.phone{width:360px;height:720px;background:#080809;border:1px solid rgba(255,255,255,0.09);border-radius:44px;overflow:hidden;box-shadow:0 50px 100px rgba(0,0,0,0.9);display:flex;flex-direction:column}
.phone-header{background:linear-gradient(180deg,#121214,#080809);padding:56px 22px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
.phone-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#222,#111);border:1px solid var(--gold);display:flex;justify-content:center;align-items:center;font-weight:500;color:var(--gl);font-family:var(--display);font-size:22px}
.phone-info{text-align:left}
.phone-name{font-size:17px;font-family:var(--display);font-weight:600;letter-spacing:1px;color:#fff}
.phone-subtitle{font-size:10px;letter-spacing:1px;color:var(--gl);text-transform:uppercase;opacity:.8;margin-top:2px;font-family:"Inter",sans-serif}
.phone-chat{flex:1;padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.phone-chat::-webkit-scrollbar{display:none}
.message-group{display:flex;flex-direction:column;max-width:85%}
.message-group.incoming{align-self:flex-start;align-items:flex-start}
.message-group.outgoing{align-self:flex-end;align-items:flex-end}
.sender-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px;color:rgba(255,255,255,0.35);font-family:"Inter",sans-serif}
.message-group.outgoing .sender-label{color:var(--gl)}
.message{padding:13px 16px;border-radius:16px;font-size:13.5px;line-height:1.5;font-weight:300;animation:msgUp .6s cubic-bezier(0.16,1,0.3,1) forwards;font-family:"Inter",sans-serif}
.message.incoming{background:#1a1a1c;color:#e0e0e0;border:1px solid rgba(255,255,255,0.05);border-top-left-radius:2px}
.message.outgoing{background:linear-gradient(135deg,#1e1e20,#111);color:#fff;border:1px solid rgba(212,175,55,0.22);border-top-right-radius:2px}
.message img{width:100%;border-radius:10px;border:1px solid rgba(212,175,55,0.25);margin-top:4px}
@keyframes msgUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#scene-dashboard{background:#050505}
.crm-container{width:100%;max-width:1050px;padding:36px;animation:fadeInBlur 1s ease-out}
.crm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;border-bottom:1px solid var(--border);padding-bottom:18px}
.crm-title{font-family:var(--display);font-size:clamp(22px,3vw,32px);letter-spacing:4px;text-transform:uppercase;color:#fff}
.simpro-badge{background:var(--blue);color:#fff;padding:5px 14px;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;border-radius:3px;font-family:"Inter",sans-serif;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.crm-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}
.crm-card{background:#0a0b0d;border:1px solid var(--border);padding:28px;border-radius:4px}
.crm-label{font-size:9.5px;color:var(--gl);text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;display:block;font-family:"Inter",sans-serif;font-weight:600}
.crm-data-row{display:grid;grid-template-columns:130px 1fr;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13.5px}
.crm-data-row:last-child{border-bottom:none}
.crm-key{color:rgba(255,255,255,0.38);text-transform:uppercase;letter-spacing:1px;font-size:10px;font-family:"Inter",sans-serif}
.crm-value{color:#fff;font-weight:400}
.status-tag{background:rgba(239,68,68,0.14);color:#f87171;padding:4px 12px;border-radius:100px;font-size:10px;font-weight:600;text-transform:uppercase;font-family:"Inter",sans-serif}
.calendar-card{background:#0a0b0d;border:1px solid var(--border);padding:28px;border-radius:4px;display:flex;flex-direction:column}
.calendar-day{background:var(--blue);color:#fff;width:56px;height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:4px;margin-bottom:18px}
.cal-m{font-size:9px;font-weight:800;text-transform:uppercase;font-family:"Inter",sans-serif}
.cal-d{font-size:22px;font-weight:700;line-height:1;font-family:"Inter",sans-serif}
.event-details{border-left:2px solid var(--blue);padding-left:18px;margin-top:8px}
.event-time{font-size:12px;color:var(--bluel);font-weight:600;margin-bottom:5px;font-family:"Inter",sans-serif}
.event-title{font-size:17px;font-weight:600;margin-bottom:4px}
.event-loc{font-size:11.5px;color:rgba(255,255,255,0.45)}
.sync-footer{margin-top:32px;text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--bluel);animation:syncpulse 2s infinite;font-family:"Inter",sans-serif}
@keyframes syncpulse{0%,100%{opacity:.4}50%{opacity:.9}}
#scene-final{background:radial-gradient(circle at center,#111 0%,#000 100%);overflow:hidden}
.final-content{text-align:center;animation:fadeInBlur 2s ease-out;position:relative;z-index:2}
.final-logo{width:120px;margin-bottom:36px;filter:drop-shadow(0 10px 28px rgba(212,175,55,0.35));animation:levitate 5s ease-in-out infinite}
@keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.final-brand{font-family:var(--display);font-size:clamp(60px,10vw,130px);font-weight:700;letter-spacing:clamp(8px,2vw,30px);text-transform:uppercase;margin-bottom:14px;background:linear-gradient(135deg,#fff 0%,#888 45%,var(--gl) 50%,#888 55%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
.final-tagline{font-family:"Inter",sans-serif;font-size:14px;letter-spacing:14px;text-transform:uppercase;color:var(--gl);font-weight:400;opacity:.75}
@keyframes fadeInBlur{from{opacity:0;filter:blur(18px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}

#page-content{position:relative;z-index:1;background:var(--bg2)}
.section{padding:96px 48px;width:100%}
.inner{max-width:1080px;margin:0 auto}
.eyebrow{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec-title{font-family:var(--display);font-size:clamp(32px,4.2vw,50px);font-weight:600;line-height:1.06;color:#fff;letter-spacing:-.5px}
.sec-title em{font-style:italic;color:var(--gl)}
.sec-sub{color:var(--soft);font-size:15.5px;line-height:1.75;max-width:640px;margin-top:14px}
.sec-sub strong{color:var(--cream);font-weight:500}
.tech-tag{display:inline-flex;align-items:center;gap:7px;background:var(--bluedim);border:1px solid rgba(37,99,235,.35);color:var(--bluel);font-size:9.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border-radius:99px;font-family:"Inter",sans-serif}
.tech-dot{width:5px;height:5px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:pulsedot 2s infinite}
@keyframes pulsedot{0%,100%{opacity:1}50%{opacity:.3}}

.deep-row{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start;padding:56px 0;border-bottom:1px solid var(--border)}
.deep-row:last-child{border-bottom:none}
.deep-row h3{font-family:var(--display);font-size:clamp(24px,2.8vw,34px);font-weight:600;color:#fff;line-height:1.12;letter-spacing:-.3px;margin-bottom:14px}
.deep-row h3 em{font-style:italic;color:var(--gl)}
.deep-row .deep-kicker{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;font-family:"Inter",sans-serif;margin-bottom:12px;display:block}
.deep-row p{font-size:14.5px;color:var(--soft);line-height:1.8;margin-bottom:14px}
.deep-row p:last-child{margin-bottom:0}
.deep-row p strong{color:var(--cream);font-weight:500}
.deep-detail{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 30px}
.deep-detail .dd-title{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:"Inter",sans-serif;margin-bottom:16px}
.dd-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.dd-list li{position:relative;padding-left:24px;font-size:13.5px;color:var(--soft);line-height:1.65}
.dd-list li::before{content:"—";color:var(--gold);position:absolute;left:0;top:0;font-weight:600}
.dd-list li strong{color:var(--cream);font-weight:500}
.dd-flow{display:flex;flex-direction:column;gap:0}
.dd-flow-step{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13.5px;color:var(--soft);line-height:1.6}
.dd-flow-step:last-child{border-bottom:none}
.dd-flow-num{color:var(--gold);font-weight:700;font-family:"Inter",sans-serif;font-size:12px;padding-top:2px;flex-shrink:0}
.dd-flow-step strong{color:var(--cream);font-weight:500}

.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.tier-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center}
.tier-card.emergency{border-color:rgba(239,68,68,.35)}
.tier-card.urgent{border-color:var(--bgold)}
.tier-card.standard{border-color:rgba(91,141,239,.35)}
.tier-card.cold{border-color:rgba(160,150,145,.35)}
.tier-card.warm{border-color:var(--bgold)}
.tier-card.hot{border-color:rgba(239,68,68,.35)}
.tier-name{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;font-family:"Inter",sans-serif;margin-bottom:14px}
.tier-card.emergency .tier-name{color:#f87171}
.tier-card.urgent .tier-name{color:var(--gl)}
.tier-card.standard .tier-name{color:var(--bluel)}
.tier-card.cold .tier-name{color:rgba(220,215,210,.6)}
.tier-card.warm .tier-name{color:var(--gl)}
.tier-card.hot .tier-name{color:#f87171}
.tier-window{font-family:var(--display);font-size:36px;font-weight:600;color:#fff;margin-bottom:14px;line-height:1}
.tier-desc{font-size:13px;color:var(--soft);line-height:1.6}

.trades-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:44px}
.trade-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;text-align:left;transition:border-color .2s}
.trade-card:hover{border-color:var(--bgold)}
.trade-name{font-family:var(--display);font-size:23px;font-weight:600;color:#fff;margin-bottom:10px}
.trade-desc{font-size:13px;color:var(--soft);line-height:1.6}

.benefits{background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.bt-wrap{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;border-radius:8px;overflow:hidden;border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,0.5)}
.bt-col{display:flex;flex-direction:column}
.bt-hdr{padding:18px 24px;font-size:11.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center}
.bt-hdr.bad{background:rgba(20,12,10,.95);border-bottom:1px solid rgba(239,68,68,.18);color:rgba(220,120,120,.75)}
.bt-hdr.good{background:var(--gdim);border-bottom:1px solid var(--bgold);color:var(--gl)}
.bt-col.left{border-right:1px solid var(--border)}
.bt-row{display:flex;align-items:flex-start;gap:12px;padding:15px 24px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px;line-height:1.55}
.bt-row:last-child{border-bottom:none}
.bt-ic{font-size:13px;flex-shrink:0;width:20px;text-align:center}
.left .bt-row{color:rgba(160,150,145,.75);background:rgba(6,4,3,.4)}
.right .bt-row{color:var(--soft)}
.right .bt-row span strong{color:var(--cream);font-weight:500}
.pricing-section{padding:110px 48px;text-align:center;background:linear-gradient(150deg,#0d0903,var(--bg3));border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.pricing-header{margin-bottom:70px;display:flex;flex-direction:column;align-items:center}
.pricing-h{font-family:var(--display);font-size:clamp(36px,4.5vw,56px);font-weight:600;color:#fff;letter-spacing:-.4px;margin-bottom:22px;line-height:1.1}
.pricing-h em{font-style:italic;color:var(--gl)}
